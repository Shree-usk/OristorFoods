name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oristor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres service container above — unit tests run `prisma db
      # push` against it via tests/unit/global-setup.ts. Not used by
      # lint/typecheck/build, which don't need a live DB.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/oristor_ci?sslmode=disable"
      AUTH_SECRET: "ci-placeholder-secret-do-not-use-in-production"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # next-env.d.ts (image-import and route types) is gitignored and only
      # generated by next dev/build, so a fresh checkout can't typecheck
      # `import logo from "*.png"` without it.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
